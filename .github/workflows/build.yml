name: build

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          } else {
            $version = '1.0-dev'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download nuget.exe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile tools\nuget.exe

      - name: Restore C++ packages
        shell: powershell
        run: .\tools\nuget.exe restore src\WebcamSwitcher.Source\WebcamSwitcher.Source.vcxproj -SolutionDirectory . -NonInteractive

      - name: Build C++ media source
        shell: powershell
        run: msbuild src\WebcamSwitcher.Source\WebcamSwitcher.Source.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:m

      - name: Build C# core
        shell: powershell
        run: dotnet build src\WebcamSwitcher.Core\WebcamSwitcher.Core.csproj -c Release

      - name: Camera Role tests (headless)
        shell: powershell
        run: dotnet run --project tools\RoleTest\RoleTest.csproj -c Release

      - name: Publish app (self-contained)
        shell: powershell
        run: |
          dotnet publish src\WebcamSwitcher.App\WebcamSwitcher.App.csproj -c Release -r win-x64 --self-contained true -o artifacts\app
          Copy-Item src\WebcamSwitcher.Source\x64\Release\WebcamSwitcher.Source.dll artifacts\app -Force

      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path artifacts\app\* -DestinationPath artifacts\WebcamSwitcher-${{ steps.version.outputs.version }}-portable.zip -Force

      - name: Build installer (Inno Setup)
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe", "C:\InnoSetup6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source }
          & $iscc /DMyAppVersion="${{ steps.version.outputs.version }}" installer\WebcamSwitcher.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebcamSwitcher
          path: |
            artifacts/app/**
            artifacts/installer/*.exe
            artifacts/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/*.exe
            artifacts/*.zip
